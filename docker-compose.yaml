services:

  habits:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput &&
        gunicorn config.wsgi:application --bind 0.0.0.0:8000
      "
    volumes:
      - .:/habits
      - static_volume:/app/staticfiles
    expose:
      - "8000"
    depends_on:
      - db
      - redis
    env_file:
      - ./.env

  nginx:
    build:
      context: ./nginx
    ports:
      - "80:8000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/habits/staticfiles
    depends_on:
      - habits

  db:
    image: postgres:17-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    expose:
      - "5432"
    env_file:
      - ./.env


  redis:
    image: redis:7
    volumes:
      - redis_volume:/data
    env_file:
      - ./.env

  celery:
    build: .
    tty: true
    command: celery -A config
    restart: on-failure
    volumes:
      - .:/habits
    depends_on:
      - redis
      - db
    env_file:
      - ./.env

  celery-beat:
    build: .
    tty: true
    command: celery -A config beat
    restart: on-failure
    volumes:
      - .:/habits
    depends_on:
      - redis
      - db
    env_file:
      - ./.env

networks:
  default:

volumes:
  postgres_data:
  static_volume:
  redis_volume:
