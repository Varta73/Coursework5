events {}

http {
    upstream habits {
        server habits-habits-1:8000;  # имя контейнера Django-приложения и порт
    }

    server {
        listen 80;
        server_name _;

        location /static/ {
            alias /habits/staticfiles/;
        }

        location / {
            proxy_pass http://habits;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
